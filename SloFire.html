<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SloFire - Mega 3D Update</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        canvas { display: block; }
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .hud { position: absolute; color: white; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); font-size: 20px; }
        #health-bar-container { bottom: 30px; left: 50%; transform: translateX(-50%); width: 300px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid white; border-radius: 10px; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background: #ff3333; transition: width 0.1s; }
        #weapon-info { bottom: 30px; right: 30px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; border-left: 5px solid #ffcc00; pointer-events: auto; cursor: pointer; }
        #alive-count { top: 20px; right: 30px; background: rgba(255, 51, 51, 0.6); padding: 8px 15px; border-radius: 5px; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: transparent; border: 2px solid #00ff00; border-radius: 50%; transform: translate(-50%, -50%); }
        #instruction { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); color: #ffcc00; font-size: 24px; text-align: center; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #long-press-progress { width: 0%; height: 5px; background: #00ff00; margin-top: 5px; transition: width 0.1s; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui-container">
        <div id="instruction" class="hud">AIRPLANE IN FLIGHT<br><span style="font-size:16px; color:white;">Press "E" to Jump with Parachute!</span></div>
        <div id="alive-count" class="hud">ALIVE: 32</div>
        
        <div id="health-bar-container" class="hud">
            <div id="health-bar"></div>
        </div>

        <div id="weapon-info" class="hud">
            <div id="gun-name">GUN: Fists</div>
            <div id="ammo-count">AMMO: 0</div>
            <div style="font-size: 11px; color: #aaa; margin-top:5px;">Hold click on this box 3s to Drop Gun</div>
            <div id="long-press-progress"></div>
        </div>
    </div>

    <script>
        // --- Game Variables & Setup ---
        let scene, camera, renderer;
        let player, airplane, parachute;
        let clock = new THREE.Clock();
        
        // Game States
        let gameState = "PLANE"; // PLANE, DIVING, PLAYING, ELIMINATED
        let alivePlayers = 32;
        let holdTimer = 0;
        let isHoldingDrop = false;

        // Arrays for processing
        let npcs = [];
        let collidableObjects = [];
        let mapItems = [];
        let bullets = [];

        // Player Stats & Controls
        let playerStats = {
            hp: 100,
            speed: 0.8,
            currentGun: null,
            ammo: 0,
            yaw: 0,
            pitch: 0
        };

        let keys = { w: false, a: false, s: false, d: false, e: false };

        // Gun Types Data
        const GUN_TYPES = {
            M416: { name: "M416", color: 0x445566, damage: 20, maxAmmo: 120, range: 150 },
            AWM: { name: "AWM", color: 0x224422, damage: 80, maxAmmo: 25, range: 300 },
            AK47: { name: "AK47", color: 0x664422, damage: 35, maxAmmo: 90, range: 120 }
        };

        // --- Init Scene ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lights
            let hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            scene.add(hemiLight);

            let dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(200, 400, 200);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Ground (Grass)
            createGround();

            // Create Environment (Houses, Rocks, Trees)
            createEnvironment();

            // Spawn Loot (Guns & Ammo)
            spawnMapLoot();

            // Create Player & NPCs
            createPlayer();
            spawnNPCs(31);

            // Create Airplane
            createAirplane();

            // Event Listeners
            window.addEventListener('keydown', (e) => handleKeyboard(e, true));
            window.addEventListener('keyup', (e) => handleKeyboard(e, false));
            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mousedown', handleMouseDown);
            
            // Long Press Drop Mechanism Setup
            setupDropMechanism();

            // Pointer Lock for FPS feel
            document.body.addEventListener('click', () => {
                if(gameState === "PLAYING") document.body.requestPointerLock();
            });

            animate();
        }

        // --- Environment Creators ---
        function createGround() {
            let groundGeo = new THREE.PlaneGeometry(1500, 1500);
            let groundMat = new THREE.MeshLambertMaterial({ color: 0x3b7a32 }); // Rich Grass Color
            let ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Add detail grass patches
            for(let i=0; i<300; i++) {
                let gpGeo = new THREE.BoxGeometry(2, Math.random()*3, 2);
                let gpMat = new THREE.MeshLambertMaterial({color: 0x4c9e42});
                let gp = new THREE.Mesh(gpGeo, gpMat);
                gp.position.set(Math.random()*1200 - 600, 0, Math.random()*1200 - 600);
                scene.add(gp);
            }
        }

        function createEnvironment() {
            // Generate Buildings/Houses, Rocks, and Trees randomly across map
            for(let i = 0; i < 40; i++) {
                let x = Math.random() * 1000 - 500;
                let z = Math.random() * 1000 - 500;
                if(Math.abs(x) < 50 && Math.abs(z) < 50) continue; // Clear zone near center start

                let type = Math.random();
                if(type < 0.3) {
                    buildHouse(x, z);
                } else if(type < 0.65) {
                    buildTree(x, z);
                } else {
                    buildRock(x, z);
                }
            }
        }

        function buildHouse(x, z) {
            let houseGroup = new THREE.Group();
            houseGroup.position.set(x, 0, z);

            // Walls (No front gate - open entry design)
            let wallMat = new THREE.MeshLambertMaterial({ color: 0xd6cbb2 });
            let wallThickness = 1;
            let houseSize = 25;
            let houseHeight = 15;

            // Back wall
            let backWall = new THREE.Mesh(new THREE.BoxGeometry(houseSize, houseHeight, wallThickness), wallMat);
            backWall.position.set(0, houseHeight/2, -houseSize/2);
            houseGroup.add(backWall);

            // Left wall
            let leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, houseHeight, houseSize), wallMat);
            leftWall.position.set(-houseSize/2, houseHeight/2, 0);
            houseGroup.add(leftWall);

            // Right wall
            let rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, houseHeight, houseSize), wallMat);
            rightWall.position.set(houseSize/2, houseHeight/2, 0);
            houseGroup.add(rightWall);

            // Front walls (leaving a wide open archway, no physical door/gate)
            let frontWallLeft = new THREE.Mesh(new THREE.BoxGeometry(houseSize*0.3, houseHeight, wallThickness), wallMat);
            frontWallLeft.position.set(-houseSize*0.35, houseHeight/2, houseSize/2);
            houseGroup.add(frontWallLeft);

            let frontWallRight = new THREE.Mesh(new THREE.BoxGeometry(houseSize*0.3, houseHeight, wallThickness), wallMat);
            frontWallRight.position.set(houseSize*0.35, houseHeight/2, houseSize/2);
            houseGroup.add(frontWallRight);

            // Roof
            let roofMat = new THREE.MeshLambertMaterial({ color: 0x9c3a3a });
            let roof = new THREE.Mesh(new THREE.ConeGeometry(houseSize * 0.8, 8, 4), roofMat);
            roof.position.set(0, houseHeight + 4, 0);
            roof.rotation.y = Math.PI / 4;
            houseGroup.add(roof);

            scene.add(houseGroup);

            // Add bounding box for solid collision checks
            let collisionBox = new THREE.Box3().setFromObject(houseGroup);
            collidableObjects.push(collisionBox);

            // Save house inner coords to spawn loot inside it later
            houseGroup.userData = { isHouse: true, size: houseSize };
            return houseGroup;
        }

        function buildTree(x, z) {
            let tree = new THREE.Group();
            tree.position.set(x, 0, z);

            let trunk = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.5, 12), new THREE.MeshLambertMaterial({color: 0x5a3d28}));
            trunk.position.y = 6;
            tree.add(trunk);

            let foliage = new THREE.Mesh(new THREE.DodecahedronGeometry(6, 1), new THREE.MeshLambertMaterial({color: 0x2e5c1e}));
            foliage.position.y = 12;
            tree.add(foliage);

            scene.add(tree);
            collidableObjects.push(new THREE.Box3().setFromObject(trunk));
        }

        function buildRock(x, z) {
            let rockGeo = new THREE.DodecahedronGeometry(3 + Math.random()*4, 0);
            let rockMat = new THREE.MeshLambertMaterial({color: 0x777777});
            let rock = new THREE.Mesh(rockGeo, rockMat);
            rock.position.set(x, 2, z);
            rock.scale.set(1, 1.5 + Math.random(), 1);
            scene.add(rock);

            collidableObjects.push(new THREE.Box3().setFromObject(rock));
        }

        // --- Loot Spawning System ---
        function spawnMapLoot() {
            // Distribute distinct weapons across the map randomly on the floor
            const weaponsPool = ['M416', 'AWM', 'AK47'];
            
            for (let i = 0; i < 60; i++) {
                let wType = weaponsPool[Math.floor(Math.random() * weaponsPool.length)];
                let rx = Math.random() * 1200 - 600;
                let rz = Math.random() * 1200 - 600;

                createLootItem(wType, rx, rz);
            }
        }

        function createLootItem(type, x, z) {
            let lootGroup = new THREE.Group();
            lootGroup.position.set(x, 0.5, z);
            lootGroup.userData = { type: type, isWeapon: true, ammo: GUN_TYPES[type].maxAmmo };

            // 3D Gun mesh representation
            let gConfig = GUN_TYPES[type];
            let barrel = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 3), new THREE.MeshLambertMaterial({color: gConfig.color}));
            barrel.position.z = -0.5;
            let body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 1.5), new THREE.MeshLambertMaterial({color: 0x222222}));
            let mag = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.4), new THREE.MeshLambertMaterial({color: 0x111111}));
            mag.position.set(0, -0.5, -0.2);

            lootGroup.add(barrel, body, mag);

            // Floating visual indicator glow/ammo box
            let ammoBox = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 1), new THREE.MeshLambertMaterial({color: 0xffcc00}));
            ammoBox.position.set(0.8, -0.1, 0);
            lootGroup.add(ammoBox);

            scene.add(lootGroup);
            mapItems.push(lootGroup);
        }

        // --- Character Modeling (Full Humanoid Body Parts) ---
        function createHumanoidMesh(colorHex) {
            let group = new THREE.Group();
            let mat = new THREE.MeshLambertMaterial({ color: colorHex });
            let skinMat = new THREE.MeshLambertMaterial({ color: 0xffdbac }); // Skin tones

            // Head
            let head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), skinMat);
            head.position.y = 5.8;
            group.add(head);

            // Torso (Body)
            let torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 1), mat);
            torso.position.y = 4;
            group.add(torso);

            // Left Arm
            let lArm = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.2, 0.6), skinMat);
            lArm.position.set(-1.4, 4, 0);
            group.add(lArm);

            // Right Arm
            let rArm = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.2, 0.6), skinMat);
            rArm.position.set(1.4, 4, 0);
            group.add(rArm);

            // Left Leg
            let lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.5, 0.8), mat);
            lLeg.position.set(-0.6, 1.65, 0);
            group.add(lLeg);

            // Right Leg
            let rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.5, 0.8), mat);
            rLeg.position.set(0.6, 1.65, 0);
            group.add(rLeg);

            // Setup weapon container slot
            let gunSlot = new THREE.Group();
            gunSlot.position.set(1.4, 3.5, -1);
            group.add(gunSlot);
            group.userData = { gunSlot: gunSlot, rArm: rArm, lArm: lArm, lLeg: lLeg, rLeg: rLeg };

            return group;
        }

        function createPlayer() {
            player = createHumanoidMesh(0x3355ff); // Blue outfit player
            player.position.set(0, 0, 0);
            scene.add(player);
        }

        function spawnNPCs(count) {
            const colors = [0xff4444, 0xffaa00, 0x8844ff, 0x00ffff, 0xff00aa];
            for(let i=0; i<count; i++) {
                let npcObj = {};
                npcObj.mesh = createHumanoidMesh(colors[Math.floor(Math.random()*colors.length)]);
                
                // Random position across map
                let rx = Math.random()*1100 - 550;
                let rz = Math.random()*1100 - 550;
                npcObj.mesh.position.set(rx, 0, rz);
                
                npcObj.hp = 100;
                npcObj.targetPos = new THREE.Vector3(Math.random()*1000 - 500, 0, Math.random()*1000 - 500);
                npcObj.speed = 0.3 + Math.random()*0.3;
                npcObj.cooldown = Math.random() * 2;
                npcObj.hasWeapon = Math.random() > 0.4 ? "AK47" : null;

                if(npcObj.hasWeapon) {
                    attachVisualGun(npcObj.mesh, npcObj.hasWeapon);
                }

                scene.add(npcObj.mesh);
                npcs.push(npcObj);
            }
        }

        function attachVisualGun(charMesh, type) {
            let slot = charMesh.userData.gunSlot;
            // Clear old attachments
            while(slot.children.length > 0) { slot.remove(slot.children[0]); }

            if(!type) return;

            let visualGun = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 1.8), new THREE.MeshLambertMaterial({color: GUN_TYPES[type].color}));
            slot.add(visualGun);
        }

        // --- Vehicle: Airplane & Parachute Modeling ---
        function createAirplane() {
            airplane = new THREE.Group();
            
            let body = new THREE.Mesh(new THREE.CylinderGeometry(4, 5, 40, 8), new THREE.MeshLambertMaterial({color: 0xdddddd}));
            body.rotation.x = Math.PI / 2;
            
            let wings = new THREE.Mesh(new THREE.BoxGeometry(60, 1, 10), new THREE.MeshLambertMaterial({color: 0xbb0000}));
            wings.position.set(0, 0, 5);

            let tail = new THREE.Mesh(new THREE.BoxGeometry(2, 8, 6), new THREE.MeshLambertMaterial({color: 0xbb0000}));
            tail.position.set(0, 4, -16);

            airplane.add(body, wings, tail);
            airplane.position.set(-600, 250, -400); // Start position high in air
            scene.add(airplane);

            // Set camera behind airplane initially
            camera.position.set(airplane.position.x, airplane.position.y + 30, airplane.position.z + 80);
            camera.lookAt(airplane.position);
        }

        function deployParachute() {
            parachute = new THREE.Group();
            let canopy = new THREE.Mesh(new THREE.SphereGeometry(6, 8, 8, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshLambertMaterial({color: 0xffaa00, side: THREE.DoubleSide}));
            canopy.position.y = 8;
            
            // Strings
            for(let i=0; i<4; i++) {
                let stringGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0,0,0),
                    new THREE.Vector3(Math.cos(i*Math.PI/2)*5, 8, Math.sin(i*Math.PI/2)*5)
                ]);
                let line = new THREE.Line(stringGeo, new THREE.LineBasicMaterial({color: 0xffffff}));
                parachute.add(line);
            }
            parachute.add(canopy);
            player.add(parachute);
        }

        // --- Controls Handlers ---
        function handleKeyboard(e, isDown) {
            let key = e.key.toLowerCase();
            if(key in keys) keys[key] = isDown;

            // Handle landing separation jump execution
            if(key === 'e' && gameState === "PLANE") {
                gameState = "DIVING";
                player.position.set(airplane.position.x, airplane.position.y - 10, airplane.position.z);
                deployParachute();
                document.getElementById('instruction').innerHTML = "DIVING INTO BATTLEFIELD<br><span style='font-size:14px;'>Gliding down safely...</span>";
            }
        }

        function handleMouseMove(e) {
            if (document.pointerLockElement !== document.body && gameState === "PLAYING") return;

            let movementX = e.movementX || 0;
            let movementY = e.movementY || 0;

            playerStats.yaw -= movementX * 0.002;
            playerStats.pitch -= movementY * 0.002;
            playerStats.pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, playerStats.pitch));
        }

        function handleMouseDown(e) {
            if(gameState !== "PLAYING") return;
            if(e.button === 0) { // Left click shoot
                fireActiveWeapon();
            }
        }

        // --- Long Press Weapon Drop Mechanics ---
        function setupDropMechanism() {
            let el = document.getElementById('weapon-info');
            
            const startPress = () => {
                if(!playerStats.currentGun) return;
                isHoldingDrop = true;
            };

            const endPress = () => {
                isHoldingDrop = false;
                holdTimer = 0;
                document.getElementById('long-press-progress').style.width = '0%';
            };

            el.addEventListener('mousedown', startPress);
            el.addEventListener('mouseup', endPress);
            el.addEventListener('mouseleave', endPress);
            
            // For touch screens context support if needed
            el.addEventListener('touchstart', startPress);
            el.addEventListener('touchend', endPress);
        }

        function fireActiveWeapon() {
            if(!playerStats.currentGun) return; // Cannot shoot fists
            if(playerStats.ammo <= 0) {
                alert("Out of Ammo! Find matching configurations inside buildings.");
                return;
            }

            playerStats.ammo--;
            document.getElementById('ammo-count').innerHTML = "AMMO: " + playerStats.ammo;

            // Shoot Raycast/Bullet logic
            let bulletGeo = new THREE.SphereGeometry(0.2, 4, 4);
            let bulletMat = new THREE.MeshBasicMaterial({color: 0xffff00});
            let bMesh = new THREE.Mesh(bulletGeo, bulletMat);
            
            // Set position at gun tip
            bMesh.position.copy(player.position).y += 4;
            
            // Direction Vector
            let dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
            bullets.push({ mesh: bMesh, dir: dir, life: 2.0, isPlayer: true });
            scene.add(bMesh);
        }

        // --- Collision and Solid Movement Utility ---
        function checkSolidCollisions(newPos, radius = 2.0) {
            let pBox = new THREE.Box3(
                new THREE.Vector3(newPos.x - radius, 0, newPos.z - radius),
                new THREE.Vector3(newPos.x + radius, 10, newPos.z + radius)
            );

            for(let i=0; i<collidableObjects.length; i++) {
                if(pBox.intersectsBox(collidableObjects[i])) {
                    return true; // Wall/Obstacle intersection triggered
                }
            }
            return false;
        }

        // --- Engine Loops and Physics Processors ---
        function animate() {
            requestAnimationFrame(animate);
            let delta = clock.getDelta();

            // Handle weapon drop evaluation timer
            if(isHoldingDrop) {
                holdTimer += delta;
                let pct = (holdTimer / 2.5) * 100; // 2.5 seconds requirement
                document.getElementById('long-press-progress').style.width = Math.min(pct, 100) + '%';

                if(holdTimer >= 2.5) {
                    // Perform actual dropping actions
                    createLootItem(playerStats.currentGun, player.position.x + 5, player.position.z + 5);
                    playerStats.currentGun = null;
                    playerStats.ammo = 0;
                    
                    document.getElementById('gun-name').innerHTML = "GUN: Fists";
                    document.getElementById('ammo-count').innerHTML = "AMMO: 0";
                    attachVisualGun(player, null);
                    isHoldingDrop = false;
                    holdTimer = 0;
                    document.getElementById('long-press-progress').style.width = '0%';
                }
            }

            // 1. Plane Stage Simulation Loop
            if(gameState === "PLANE") {
                airplane.position.x += 40 * delta;
                camera.position.set(airplane.position.x, airplane.position.y + 40, airplane.position.z + 100);
                camera.lookAt(airplane.position);

                if(airplane.position.x > 600) airplane.position.x = -600; // Loop bounds inside bounds
            }

            // 2. Parachute Diving Loop Processing
            else if(gameState === "DIVING") {
                player.position.y -= 12 * delta; // Glide speed
                player.position.x += 8 * delta; // Forward momentum vector

                camera.position.set(player.position.x, player.position.y + 15, player.position.z + 30);
                camera.lookAt(player.position);

                // Handle ground connection check safely
                if(player.position.y <= 0) {
                    player.position.y = 0;
                    if(parachute) player.remove(parachute);
                    gameState = "PLAYING";
                    document.getElementById('instruction').style.display = "none";
                    document.body.requestPointerLock();
                }
            }

            // 3. Active Playing Simulation State Processing
            else if(gameState === "PLAYING") {
                // Update Player Orientations
                player.rotation.y = playerStats.yaw;
                
                let targetCamRotation = new THREE.Quaternion().setFromEuler(new THREE.Euler(playerStats.pitch, playerStats.yaw, 0, 'YXZ'));
                camera.quaternion.copy(targetCamRotation);

                // Update Camera Positioning directly behind custom 3D mesh model structure
                let offset = new THREE.Vector3(0, 7, 15).applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, playerStats.yaw, 0)));
                camera.position.copy(player.position).add(offset);

                // Handle Basic Movements inside boundary loops checking configurations safely
                let moveVec = new THREE.Vector3();
                if(keys.w) moveVec.z -= 1;
                if(keys.s) moveVec.z += 1;
                if(keys.a) moveVec.x -= 1;
                if(keys.d) moveVec.x += 1;
                moveVec.normalize().applyQuaternion(player.quaternion);

                if(moveVec.lengthSq() > 0) {
                    let nextStep = player.position.clone().addScaledVector(moveVec, playerStats.speed);
                    // Solid Environment wall check validator protection
                    if(!checkSolidCollisions(nextStep, 1.5)) {
                        player.position.copy(nextStep);
                    }

                    // Animate body legs dynamically moving while running
                    let t = clock.getElapsedTime() * 12;
                    player.userData.lLeg.rotation.x = Math.sin(t) * 0.6;
                    player.userData.rLeg.rotation.x = -Math.sin(t) * 0.6;
                } else {
                    player.userData.lLeg.rotation.x = 0;
                    player.userData.rLeg.rotation.x = 0;
                }

                // Loot items collision overlapping pickup loop tracker
                for(let i = mapItems.length - 1; i >= 0; i--) {
                    let item = mapItems[i];
                    let dist = player.position.distanceTo(item.position);
                    if(dist < 4.0) { // Touch target trigger distance checked
                        if(!playerStats.currentGun) {
                            playerStats.currentGun = item.userData.type;
                            playerStats.ammo = item.userData.ammo;
                            
                            document.getElementById('gun-name').innerHTML = "GUN: " + playerStats.currentGun;
                            document.getElementById('ammo-count').innerHTML = "AMMO: " + playerStats.ammo;

                            attachVisualGun(player, playerStats.currentGun);
                            scene.remove(item);
                            mapItems.splice(i, 1);
                        }
                    }
                }

                // Update NPCs loop parameters processing AI logic updates
                processNPCLogic(delta);
            }

            // Process Active Flying Bullets Processing Loops safely
            processBullets(delta);

            renderer.render(scene, camera);
        }

        function processNPCLogic(delta) {
            let livingCount = 1; // Includes player

            for(let i=0; i<npcs.length; i++) {
                let npc = npcs[i];
                if(npc.hp <= 0) continue;
                livingCount++;

                // Basic AI direction routing navigation tracking points loops configuration setup
                let distToTarget = npc.mesh.position.distanceTo(npc.targetPos);
                if(distToTarget < 5) {
                    npc.targetPos.set(Math.random()*1100 - 550, 0, Math.random()*1100 - 550);
                }

                let dir = new THREE.Vector3().subVectors(npc.targetPos, npc.mesh.position).normalize();
                let nextNpcStep = npc.mesh.position.clone().addScaledVector(dir, npc.speed);
                
                // Solid collision check for NPCs so they also don't go through houses/rocks
                if(!checkSolidCollisions(nextNpcStep, 1.5)) {
                    npc.mesh.position.copy(nextNpcStep);
                } else {
                    // Change destination if stuck on a wall
                    npc.targetPos.set(Math.random()*1100 - 550, 0, Math.random()*1100 - 550);
                }

                npc.mesh.lookAt(npc.targetPos.x, npc.mesh.position.y, npc.targetPos.z);

                // NPC Combat firing capabilities simulation loop engine logic
                npc.cooldown -= delta;
                if(npc.cooldown <= 0 && npc.hasWeapon) {
                    let pDist = npc.mesh.position.distanceTo(player.position);
                    if(pDist < 100 && gameState === "PLAYING") {
                        // Fire towards user directions
                        let bDir = new THREE.Vector3().subVectors(player.position, npc.mesh.position).normalize();
                        let bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 4, 4), new THREE.MeshBasicMaterial({color: 0xff0000}));
                        bMesh.position.copy(npc.mesh.position).y += 4;
                        
                        bullets.push({ mesh: bMesh, dir: bDir, life: 1.5, isPlayer: false });
                        scene.add(bMesh);
                    }
                    npc.cooldown = 2.0 + Math.random()*2.0; // Reset randomized reload interval speed
                }
            }

            if(alivePlayers !== livingCount) {
                alivePlayers = livingCount;
                document.getElementById('alive-count').innerHTML = "ALIVE: " + alivePlayers;
            }
        }

        function processBullets(delta) {
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, 180 * delta); // High bullet speed
                b.life -= delta;

                // Collision evaluations check hit tests indicators targets
                if(b.isPlayer) {
                    // Check hitting an NPC enemy combatant targets loop
                    for(let j=0; j<npcs.length; j++) {
                        let npc = npcs[j];
                        if(npc.hp > 0 && b.mesh.position.distanceTo(npc.mesh.position) < 3.5) {
                            let dmg = GUN_TYPES[playerStats.currentGun]?.damage || 10;
                            npc.hp -= dmg;
                            b.life = 0; // Terminate bullet trace element processing loop array
                            if(npc.hp <= 0) {
                                scene.remove(npc.mesh);
                            }
                        }
                    }
                } else {
                    // Check hitting human actual user configuration targets trace
                    if(b.mesh.position.distanceTo(player.position) < 3.0 && gameState === "PLAYING") {
                        playerStats.hp -= 10; // Basic general damage absorption calculation standard
                        b.life = 0;
                        document.getElementById('health-bar').style.width = Math.max(playerStats.hp, 0) + '%';
                        
                        if(playerStats.hp <= 0) {
                            gameState = "ELIMINATED";
                            document.exitPointerLock();
                            alert("WASTED! Better Luck Next Time on REHAN YT CUTE GAMING!");
                            location.reload(); // Quick page refresh execution to play clean again safely
                        }
                    }
                }

                if(b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }
        }

        // Run application setup initializers
        window.onload = init;
    </script>
</body>
